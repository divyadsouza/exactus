[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exactus"
version = "0.1.0"
description = "A specialized language model for zero-hallucination structured output generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "USFCA ML & Inference Lab"}]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]